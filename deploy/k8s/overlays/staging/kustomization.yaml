# Staging: production-like. Managed PostgreSQL and Kafka (same as production, separate
# instances), masked production subset + reference catalog, 2 replicas to catch state bugs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-staging
resources:
  - ../../base
configMapGenerator:
  - name: shop-config
    behavior: merge
    literals:
      - DB_HOST=shop-staging.postgres.example.internal
      - KAFKA_BOOTSTRAP_SERVERS=shop-staging.kafka.example.internal:9092
      - SHOP_TOPICS_REPLICAS=3
# shop-db secret is provisioned by the platform (External Secrets / Vault), never in Git.
replicas:
  - { name: customer-service, count: 2 }
  - { name: product-service, count: 2 }
  - { name: cart-service, count: 2 }
patches:
  - target: { kind: Deployment, name: product-service }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: SPRING_PROFILES_ACTIVE, value: seed }
  - target: { kind: Ingress, name: shop }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.shop.example.com
