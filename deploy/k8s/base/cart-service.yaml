apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels: { app: cart-service, part-of: shop }
spec:
  replicas: 1
  selector:
    matchLabels: { app: cart-service }
  template:
    metadata:
      labels: { app: cart-service, part-of: shop }
    spec:
      containers:
        - name: cart-service
          image: ghcr.io/iebouihi/qa-for-ms-services/cart-service:latest
          ports:
            - containerPort: 8083
          env:
            - name: DB_URL
              value: jdbc:postgresql://$(DB_HOST):5432/carts
          envFrom:
            - configMapRef: { name: shop-config }
            - secretRef: { name: shop-db }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
spec:
  selector: { app: cart-service }
  ports:
    - port: 8083
      targetPort: 8083
