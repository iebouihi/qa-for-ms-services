apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend, part-of: shop }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend, part-of: shop }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/iebouihi/qa-for-ms-services/frontend:latest
          ports:
            - containerPort: 8080
          env:
            - { name: CUSTOMER_SERVICE_URL, value: "http://customer-service:8081" }
            - { name: PRODUCT_SERVICE_URL, value: "http://product-service:8082" }
            - { name: CART_SERVICE_URL, value: "http://cart-service:8083" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 8080 } }
