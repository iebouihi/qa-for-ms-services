server:
  port: ${PORT:8082}

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/products}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

---
# Non-production environments load the reference catalog (test data as code).
spring:
  config:
    activate:
      on-profile: seed
  flyway:
    locations: classpath:db/migration,classpath:db/seed
