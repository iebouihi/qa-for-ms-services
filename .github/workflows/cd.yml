# Continuous delivery (reference). Runs after CI is green on main.
# Every job is disabled until the repository variable DEPLOY_ENABLED is set to "true"
# and the cluster / registry / Pact Broker secrets exist, so this file is safe as-is.
#
#   publish images -> can-i-deploy -> staging -> staging journeys -> prod canary -> synthetic checks -> 100%
#
# Target cadence: twice a week or more, with no manual regression in the path.
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  TAG: sha-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish-images:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp -DskipTests package
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once, promote everywhere
        run: |
          for svc in customer-service product-service cart-service; do
            docker build -f services/Dockerfile --build-arg JAR_FILE=services/$svc/target/$svc-1.0.0-SNAPSHOT.jar \
              -t $REGISTRY/$svc:$TAG . && docker push $REGISTRY/$svc:$TAG
          done
          docker build -t $REGISTRY/frontend:$TAG frontend && docker push $REGISTRY/frontend:$TAG

  can-i-deploy:
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Contract gate (Pact Broker)
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_URL }}
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          for p in cart-service customer-service product-service; do
            docker run --rm -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN pactfoundation/pact-cli:latest \
              pact-broker can-i-deploy --pacticipant $p --version $TAG --to-environment staging
          done

  deploy-staging:
    needs: can-i-deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy (the pipeline is the only way to change staging, so no drift)"
        env:
          KUBECONFIG_DATA: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          echo "$KUBECONFIG_DATA" > kubeconfig && export KUBECONFIG=$PWD/kubeconfig
          cd deploy/k8s/overlays/staging
          for svc in customer-service product-service cart-service frontend; do
            kustomize edit set image ghcr.io/iebouihi/qa-for-ms-services/$svc=$REGISTRY/$svc:$TAG
          done
          kubectl apply -k . && kubectl -n shop-staging rollout status deploy --timeout=300s

  staging-journeys:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B -ntp -Pjourneys -pl tests/api-tests verify -Dshop.baseUrl=${{ vars.STAGING_URL }}
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - working-directory: e2e
        env: { BASE_URL: "${{ vars.STAGING_URL }}" }
        run: npm ci && npx playwright install --with-deps chromium && npm run test:journeys

  production-canary:
    needs: staging-journeys
    runs-on: ubuntu-latest
    environment: production   # optional approval; the goal is to remove it once metrics are trusted
    steps:
      - name: Progressive rollout
        run: |
          echo "Shift 10% of traffic to $TAG (Argo Rollouts / service mesh),"
          echo "run synthetic journeys against production, compare error rate and latency"
          echo "with the stable version, then promote to 100% or roll back automatically."
