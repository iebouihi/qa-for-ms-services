# Continuous integration = the automated replacement of the manual regression.
#
#   Gate 1 (parallel, ~10 min): unit + contract + component tests, frontend tests,
#                               UI against a fake backend, manifests render.
#   Gate 2 (~10 min):           the full stack in an ephemeral environment (docker compose),
#                               API journeys + Playwright journeys.
#
# A PR can merge only when both gates are green (configure them as required checks).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: "Gate 1 · Backend: unit, contract, component"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Reactor order: libs -> cart (writes pacts) -> customer & product (verify pacts).
      # surefire = unit + contract tests; failsafe = component tests with Testcontainers.
      - name: Build and test
        run: mvn -B -ntp verify 2>&1 | tee maven.log; exit ${PIPESTATUS[0]}
      - name: Explain failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py maven.log
      - name: Upload contracts (pact files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: contracts/pacts/
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
          if-no-files-found: ignore
      - name: Upload service jars (promoted unchanged to the next stages)
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: services/*/target/*-1.0.0-SNAPSHOT.jar
          retention-days: 3

  frontend:
    name: "Gate 1 · Frontend: unit tests and build"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  ui-mocked:
    name: "Gate 1 · UI against a fake backend (Playwright)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run test:mocked
        working-directory: e2e
      - name: Explain failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mocked-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  manifests:
    name: "Gate 1 · Kubernetes manifests render"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render every overlay
        run: |
          for overlay in preview staging production; do
            echo "::group::$overlay"
            kubectl kustomize "deploy/k8s/overlays/$overlay" > "/tmp/$overlay.yaml"
            grep -c '^kind:' "/tmp/$overlay.yaml"
            echo "::endgroup::"
          done
      - name: Production never loads test data
        run: |
          if kubectl kustomize deploy/k8s/overlays/production | grep -q 'value: seed'; then
            echo "::error::The seed profile must not be enabled in production"; exit 1
          fi

  system:
    name: "Gate 2 · Ephemeral environment: API + UI journeys"
    needs: [backend, frontend, ui-mocked]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: services/
      - name: Start the full stack (same images as Kubernetes)
        run: docker compose up -d --build --wait --wait-timeout 300 2>&1 | tee compose-up.log; exit ${PIPESTATUS[0]}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: API journeys (REST Assured)
        run: mvn -B -ntp -Pjourneys -pl tests/api-tests verify -Dshop.baseUrl=http://localhost:8080 2>&1 | tee journeys.log; exit ${PIPESTATUS[0]}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: UI journeys (Playwright)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:journeys
      - name: Collect service logs (search by correlation id, e.g. journey-cart-...)
        if: failure()
        run: |
          docker compose ps -a > compose-status.txt 2>&1 || true
          docker compose logs --no-color > compose-logs.txt
          grep -E " ERROR |Exception" compose-logs.txt | head -40 > compose-errors.txt || true
      - name: Explain failures
        if: failure()
        run: python3 .github/scripts/annotate-test-failures.py journeys.log compose-errors.txt tail:compose-up.log tail:compose-status.txt
      - name: Upload journey reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-reports
          path: |
            compose-logs.txt
            tests/api-tests/target/surefire-reports/
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: docker compose down -v
