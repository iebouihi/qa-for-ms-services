# Serves the Angular build and routes /api/* to each service: a minimal API gateway.
# Service URLs come from environment variables, so the same image runs in every environment.
server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;

    location /api/customers { proxy_pass ${CUSTOMER_SERVICE_URL}; proxy_set_header X-Correlation-Id $http_x_correlation_id; }
    location /api/products  { proxy_pass ${PRODUCT_SERVICE_URL};  proxy_set_header X-Correlation-Id $http_x_correlation_id; }
    location /api/carts     { proxy_pass ${CART_SERVICE_URL};     proxy_set_header X-Correlation-Id $http_x_correlation_id; }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
